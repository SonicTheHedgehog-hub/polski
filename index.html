<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Polski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F0;--panel:#FFFFFF;--line:#E8DDCB;--ink:#1B1B1F;--muted:#5C5F66;--red:#C8102E;--blue:#1F5FAD;--green:#1E8C93;--ochre:#F2B705;--gold:#F2B705;--hl:#FFE28A;--okbg:#DDF1EA;--ok:#17624A;--badbg:#FBE0E4;--bad:#A30D25;--path:#DCCDB3;--lock:#EFE6D6;--lockSh:#D8CAB2;--accent:#C8102E;--onRed:#FFFFFF;--teal:#1E8C93;--pink:#D6336C;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--panel:#1E1E1E;--line:#34343A;--ink:#F5EFE6;--muted:#B5B5BA;--red:#C8102E;--blue:#4C8BE0;--green:#1E8C93;--hl:#7A5B00;--okbg:#123B30;--ok:#7FDCBB;--badbg:#45161E;--bad:#FF9AA8;--path:#45454C;--lock:#2A2A2E;--lockSh:#0C0C0C;--accent:#FF6B81;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121212;--panel:#1E1E1E;--line:#34343A;--ink:#F5EFE6;--muted:#B5B5BA;--red:#C8102E;--blue:#4C8BE0;--green:#1E8C93;--hl:#7A5B00;--okbg:#123B30;--ok:#7FDCBB;--badbg:#45161E;--bad:#FF9AA8;--path:#45454C;--lock:#2A2A2E;--lockSh:#0C0C0C;--accent:#FF6B81;color-scheme:dark}
*{box-sizing:border-box;font-synthesis-weight:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.scroll{flex:1;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-family:'DM Serif Display',Georgia,serif;font-size:24px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 8px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);border:0;min-height:44px}
.chip img{height:34px}.chip .off{filter:grayscale(1);opacity:.5}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--panel);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:14px}
.hero{position:relative;overflow:hidden;background:var(--red);color:var(--onRed);border-radius:22px;padding:18px;margin-bottom:14px}
.hero .orn{position:absolute;opacity:.2;pointer-events:none}
.kick{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero h2{font-family:'DM Serif Display',Georgia,serif;font-size:27px;line-height:1.1;margin:4px 0 10px}
.mini{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;margin-top:6px}.mini span:first-child{width:72px}
.bar{flex:1;height:8px;border-radius:4px;background:rgba(251,246,236,.3);overflow:hidden}.bar i{display:block;height:100%;background:#F2B705;border-radius:4px}
.bar.dark{background:var(--line)}.bar.dark i{background:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;border:0;font-weight:800;font-size:17px}
.btn.light{background:#FFFFFF;color:#C8102E}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.red{background:var(--red);color:var(--onRed)}
.btn.ghost{background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.hero .btn{margin-top:14px}
.chaps{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 12px;padding:2px 18px;scrollbar-width:none}
.chaps button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.chaps button[aria-pressed=true]{background:var(--blue);color:#FBF6EC;box-shadow:none}
.chaps button.lockc{color:var(--muted)}
.banner{border-radius:20px;overflow:hidden;background:#F6F0E2;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:6px}
.banner img{display:block;width:100%;height:150px;object-fit:cover}
.banner .cap{padding:12px 16px;background:var(--panel)}
.banner h3{font-family:'DM Serif Display',Georgia,serif;margin:0;font-size:22px;display:flex;align-items:baseline;gap:8px}
.lvl{font-family:"Nunito Sans",sans-serif;font-size:13px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--blue);color:#FBF6EC}
.sub{font-size:14px;color:var(--muted)}
.path{position:relative;padding:8px 0 10px;overflow:hidden}
.node{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;width:auto}
.dot{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.node .t{font-family:'DM Serif Display',Georgia,serif;font-weight:700;font-size:18px}
.node .s{font-size:13px;font-weight:600;color:var(--muted)}
.node.cur .t{font-size:21px;color:var(--accent)}
.node.lock .t{color:var(--muted)}
.conn{display:block;height:24px}
.mascotcur{height:64px;flex:none;margin-left:2px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:2px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted);position:relative;min-height:52px}
.tabbar button[aria-current=page]{color:var(--accent);font-weight:800}
.tabbar .cnt{position:absolute;top:2px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#FBF6EC;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
h1.page{font-family:'DM Serif Display',Georgia,serif;font-size:28px;margin:4px 0 12px}
.center{text-align:center}
.mascot{display:block;margin:0 auto;max-width:100%}
/* Lesson */
.lhead{position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:2px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px}
.lhead+.scroll{padding-top:18px}
.lhead .row{display:flex;align-items:center;gap:12px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.steps i{height:6px;border-radius:3px;background:var(--line)}.steps i.d{background:var(--green)}.steps i.c{background:var(--red)}
.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:2px solid var(--line);padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.lfoot>div{max-width:444px;margin:0 auto;display:flex;gap:10px;align-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:14px}
.seg button{border:0;background:var(--panel);min-height:44px;font-weight:700;font-size:14px;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--blue);color:#FBF6EC}
.line{margin-bottom:18px;border-radius:14px;padding:6px 6px 8px;transition:background .2s}
.line.active{background:var(--panel);box-shadow:inset 0 0 0 2px var(--ochre)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.who.me{color:var(--red)}
.say{width:36px;height:36px;border-radius:18px;border:0;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);display:inline-flex;align-items:center;justify-content:center}
.toks{display:flex;flex-wrap:wrap;gap:2px 4px}
.tok{display:flex;flex-direction:column;align-items:flex-start;border:0;background:none;padding:4px 6px;border-radius:8px;min-height:44px;text-align:left}
.tok .sv{font-family:'DM Serif Display',Georgia,serif;font-weight:500;font-size:22px;line-height:1.15}
.tok .de{font-size:13px;font-weight:700;color:var(--muted);line-height:1.15;visibility:hidden}
.tok.show .de{visibility:visible}
.tok.cur{background:var(--hl)}
.sense{font-size:14px;font-style:italic;color:var(--muted);padding-left:6px}
.line.aus .sense{display:none}.line.aus.rev .sense{display:block}.line.aus.rev .tok .de{visibility:visible}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:700;font-size:14px;padding:6px;min-height:36px}
.big{font-family:'DM Serif Display',Georgia,serif;font-size:30px;line-height:1.2;margin:8px 0}
.speed{display:flex;gap:8px;justify-content:center;margin:12px 0}
.speed button{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:14px}
.speed button[aria-pressed=true]{background:var(--blue);color:#FBF6EC;box-shadow:none}
.answer{min-height:64px;border-radius:16px;border:2px dashed var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin:12px 0}
.answer.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.answer.bad{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.w{min-height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);font-family:'DM Serif Display',Georgia,serif;font-size:19px}
.w.used{visibility:hidden}
.fb{border-radius:14px;padding:12px 14px;font-weight:700;margin-top:8px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.grammar{border-radius:20px;padding:18px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--ochre);margin-bottom:14px}
.grammar h3{font-family:'DM Serif Display',Georgia,serif;margin:4px 0 8px;font-size:22px}
.tips{margin:0;padding-left:20px}.tips li{margin:6px 0}
/* Review */
.rcard{min-height:280px;border-radius:24px;background:var(--red);color:var(--onRed);padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;outline:2px solid rgba(251,246,236,.5);outline-offset:-12px}
.rcard.back{background:#F2B705;color:#1B1B1F;outline-color:rgba(27,27,31,.3)}
.rcard .q{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.rcard .f{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(26px,8vw,36px);line-height:1.15}
.rcard .b{font-size:17px;font-weight:700}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.rate button{min-height:64px;border-radius:16px;border:2px solid var(--ink);background:transparent;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.rate button small{font-weight:600;font-size:12px;color:var(--muted)}
.rate .g{background:var(--green);border-color:var(--green);color:#FBF6EC}.rate .g small{color:#E4EFE0}
/* Progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 2px var(--line)}
.stat b{display:block;font-family:'DM Serif Display',Georgia,serif;font-size:26px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.week i{display:block;height:8px;border-radius:4px;background:var(--line);margin-top:4px}.week i.on{background:var(--ochre)}.week .today{color:var(--ink)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.badge{background:var(--panel);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 2px var(--line);text-align:center}
.badge img{width:96px;height:96px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 8px}
.badge.ch img{box-shadow:0 0 0 4px var(--ochre)}
.badge.locked img{filter:grayscale(1);opacity:.4}
.badge b{display:block;font-size:15px}.badge span{font-size:12px;color:var(--muted)}
.gold{filter:sepia(1) saturate(3) hue-rotate(-12deg) brightness(1.05)}
.h2{font-family:'DM Serif Display',Georgia,serif;font-size:21px;margin:22px 0 10px}
.trow{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin:12px 0 6px}
/* Listen */
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.now{border-radius:20px;background:#1F5FAD;color:#FBF6EC;padding:18px;margin-bottom:14px;min-height:120px}
.now .big{color:#FBF6EC;font-size:26px}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,28,46,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-weight:800;margin:16px 0 6px}
.sheet .seg{margin-bottom:4px}
textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:13px/1.4 ui-monospace,monospace;padding:10px}
#toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:30;max-width:440px;margin:0 auto;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;display:flex;align-items:center;gap:10px}
#toast[hidden]{display:none}
#toast img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.warn{background:var(--badbg);color:var(--bad);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:14px}
.tip{display:inline-block;margin:6px 0 0 6px;padding:4px 10px;border-radius:999px;background:#FFF3CC;color:#6B4E00;font-size:13px;font-weight:700}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.trio div{background:var(--panel);border-radius:16px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--line)}
.trio b{display:block;font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:21px}
.trio span{font-size:12px;font-weight:700;color:var(--muted)}
.qcard{position:relative;overflow:hidden;border-radius:24px;background:#1F5FAD;color:#FFFFFF;padding:22px 20px;margin-bottom:14px}
.qcard .big{color:#FFFFFF;margin:6px 0 4px}
.model{border-radius:20px;background:var(--panel);box-shadow:inset 0 0 0 2px #F2B705;padding:14px 16px;margin-bottom:14px}
.chipsel{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chipsel button{min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);font-family:'DM Serif Display',Georgia,serif;font-size:19px}
.chipsel button[aria-pressed=true]{background:var(--red);color:#FFFFFF;box-shadow:none}
.wordrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.wordrow:last-child{border-bottom:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center">Ładowanie …</p></div>
<div id="toast" role="status" hidden></div>
<script>
"use strict";
const NAME = "Semyon";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const today = () => ymd(new Date());
const DAY = 864e5;

/* ---------- State ---------- */
const DEF = () => ({v: 1, updated: 0, pts: 0, done: {}, cards: {}, days: {}, badges: {}, reviews: 0,
  set: {theme: "auto", decode: "immer", rate: 0.85, sound: true, goalApp: 30, goalListen: 20, goalSpeak: 10, voice: "", multi: true, natural: true}});
let S = DEF();
try { const r = JSON.parse(localStorage.getItem("polski-v1") || "null"); if (r && r.v) S = Object.assign(DEF(), r, {set: Object.assign(DEF().set, r.set || {})}); } catch (e) {}
let D = null;                      // lesson data
let ui = {tab: "path", chapter: "pierwsze", speak: {mode: "answer", i: 0, shown: false, snd: "sz", sh: 0}, sheet: false, lesson: null, review: null, listen: {playing: false, idx: -1, text: "", sense: ""}, importOpen: false, resetArmed: false};

function saveLocal() { try { localStorage.setItem("polski-v1", JSON.stringify(S)); } catch (e) {} }
function save() { S.updated = Date.now(); saveLocal(); Sync.push(); }
/* Sicherung im Netz: hier wird später Supabase eingehängt. */
const Sync = {enabled: false, push() {}, async init() {}};
function schedulePush() { Sync.push(); }
function pushDb() { Sync.push(); }
async function initStorage() { try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {} Sync.init(); }

/* ---------- Days, streak, points ---------- */
function dayRec(d) { const r = S.days[d] || (S.days[d] = {app: 0, listen: 0, speak: 0, act: false}); if (r.speak == null) r.speak = 0; return r; }
function markActive() { const r = dayRec(today()); if (!r.act) { r.act = true; save(); } }
function streak() {
  const d = new Date(); let n = 0;
  if (!(S.days[ymd(d)] || {}).act) d.setDate(d.getDate() - 1);
  while ((S.days[ymd(d)] || {}).act) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const level = () => Math.floor(S.pts / 150) + 1;
function addPts(n) { const l0 = level(); S.pts += n; markActive(); if (level() > l0) toast("Level " + level() + " erreicht!", "img/flying.webp"); checkBadges(); save(); }

let lastInput = Date.now(), speakingKind = null;
["pointerdown", "keydown", "scroll", "touchstart"].forEach(ev => addEventListener(ev, () => { lastInput = Date.now(); }, {passive: true}));
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  const listening = speakingKind === "listen" && isSpeaking();
  if (!listening && Date.now() - lastInput > 90000) return;
  const r = dayRec(today());
  const speaking = ui.tab === "speak" && !ui.lesson || (ui.lesson && ui.lesson.step === 3 && ui.lesson.phase === "steps");
  if (listening) r.listen += 5; else if (speaking) r.speak += 5; else r.app += 5;
  saveLocal();
  if (r.app % 60 === 0) schedulePush();
}, 5000);

/* ---------- Sound ---------- */
let ac = null;
function unlockAudio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} }
function tone(f, t0, dur, vol, type) {
  if (!ac || !S.set.sound) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
  o.type = type || "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .18, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}
const sfx = {
  ok() { tone(659, 0, .18); tone(880, .12, .3); },
  bad() { tone(247, 0, .22, .14, "triangle"); tone(196, .16, .3, .12, "triangle"); },
  done() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .4, .16)); },
  tap() { tone(520, 0, .08, .08); }
};

/* ---------- Speech ---------- */

async function playLesson(highlight) {
  const L = ui.lesson; if (!L) return;
  if (L.playing) { stopSpeech(); L.playing = false; L.status = ""; render(); return; }
  stopSpeech(); const my = playTok; L.playing = true; render();
  speakingKind = "listen";
  for (let i = 0; i < L.l.lines.length; i++) {
    if (my !== playTok) return;
    const ln = L.l.lines[i], text = lineText(ln);
    L.status = "Satz " + (i + 1) + " von " + L.l.lines.length; const st = $("#status"); if (st) st.textContent = L.status;
    document.querySelectorAll(".line.active,.tok.cur").forEach(x => x.classList.remove("active", "cur"));
    const le = $("#ln-" + i); if (le && highlight) { le.classList.add("active"); le.scrollIntoView({block: "center", behavior: "smooth"}); }
    const offs = []; let pos = 0; ln.t.forEach(p => { offs.push(pos); pos += p[0].length + 1; });
    await speak(text, {who: ln.who, onboundary: highlight ? ev => {
      if (my !== playTok) return;
      let k = 0; for (let j = 0; j < offs.length; j++) if (ev.charIndex >= offs[j]) k = j;
      document.querySelectorAll(".tok.cur").forEach(x => x.classList.remove("cur"));
      const t = $("#tk-" + i + "-" + k); if (t) t.classList.add("cur");
    } : null});

  }

  render();
}
function finishLesson() {

/* ---------- Recording (Nachsprechen) ---------- */
const Rec = {
  mr: null, chunks: [], url: null, stream: null, timer: null,
  async start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { toast("Aufnehmen geht in diesem Browser nicht."); return; }
    try { this.stream = await navigator.mediaDevices.getUserMedia({audio: true}); } catch (e) { toast("Kein Zugriff aufs Mikrofon. Erlaube es in den iPhone-Einstellungen."); return; }
    this.chunks = []; this.mr = new MediaRecorder(this.stream);
    this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.onstop = () => {
      clearTimeout(this.timer);
      if (this.url) URL.revokeObjectURL(this.url);
      this.url = URL.createObjectURL(new Blob(this.chunks, {type: this.mr.mimeType || "audio/mp4"}));
      this.stream.getTracks().forEach(t => t.stop());
      if (ui.lesson) { ui.lesson.recState = "done"; render(); this.play(); }
    };
    this.mr.start(); if (ui.lesson) { ui.lesson.recState = "rec"; render(); }
    this.timer = setTimeout(() => this.stop(), 15000);
  },
  stop() { if (this.mr && this.mr.state === "recording") this.mr.stop(); },
  play() { if (this.url) new Audio(this.url).play().catch(() => {}); },
  reset() { this.stop(); if (this.url) URL.revokeObjectURL(this.url); this.url = null; if (ui.lesson) ui.lesson.recState = ""; }
};

      h += '<div class="rate" style="grid-template-columns:1fr 1fr"><button data-act="spNext" data-ok="0">Nochmal üben</button><button class="g" data-act="spNext" data-ok="1">Hat geklappt</button></div>';
    }
    h += '<p class="note center">Frage ' + (P.i % total + 1) + " von " + total + " · aus deinen geschafften Lektionen</p>";
  } else if (P.mode === "shadow") {
    const ln = curShadow(), total = speakPool().flatMap(l => l.lines).length;
    h += '<div class="card"><div class="kick" style="color:var(--muted)">Satz ' + (P.sh % total + 1) + " von " + total + " · " + esc(ln.who) + '</div><div class="big">' + esc(lineText(ln)) + '</div><div class="sub">' + esc(ln.sense) + "</div>" + (ln.tip ? '<span class="tip" style="margin-left:0">' + esc(ln.tip) + "</span>" : "") + "</div>";
    h += '<div style="display:flex;gap:10px;justify-content:center;margin-bottom:12px"><button class="btn red" data-act="spSh" data-r="1">' + ic("spk") + ' Anhören</button><button class="btn ghost" data-act="spSh" data-r=".6">Langsam</button></div>';
    h += '<p class="sub center">Hör zu und sprich gleichzeitig mit, wie ein Schatten. Wiederhole jeden Satz zwei- bis dreimal.</p>';
    h += '<button class="btn primary block" style="min-height:56px" data-act="spShNext">Nachgesprochen ' + ic("check", 20, 2.5) + "</button>";
  } else {
    const g = D.sounds.find(x => x.id === P.snd) || D.sounds[0];
    h += '<div class="chipsel" role="group" aria-label="Laute">' + D.sounds.map(x => '<button data-act="spSnd" data-v="' + x.id + '" aria-pressed="' + (x.id === g.id) + '">' + esc(x.title) + "</button>").join("") + "</div>";
    h += '<div class="card"><p style="margin-top:0">' + esc(g.de) + "</p>" + g.words.map(w => '<div class="wordrow"><button class="say" data-act="spWord" data-w="' + esc(w[0]) + '" aria-label="' + esc(w[0]) + ' anhören">' + ic("spk", 16) + '</button><div style="flex:1"><span class="serif" style="font-size:22px">' + esc(w[0]) + '</span><div class="sub">' + esc(w[1]) + "</div></div></div>").join("") + "</div>";
    h += '<button class="btn red block" data-act="spSndAll">' + ic("play") + " Alle nacheinander, mit Pause zum Nachsprechen</button>";
  }
  return h;
}

/* ---------- Settings ---------- */
function sheet() {
  const seg = (key, opts) => '<div class="seg" role="group">' + opts.map(([v, t]) => '<button data-act="setv" data-k="' + key + '" data-v="' + v + '" aria-pressed="' + (String(S.set[key]) === String(v)) + '">' + t + "</button>").join("") + "</div>";
  let h = '<div class="sheet" data-act="closeSheetBg"><div role="dialog" aria-label="Einstellungen"><div class="top"><h1 class="page" style="margin:0">Einstellungen</h1><button class="iconbtn" data-act="closeSheet" aria-label="Schließen">' + ic("close") + "</button></div>";
  h += "<label>Erscheinungsbild</label>" + seg("theme", [["auto", "Automatisch"], ["light", "Hell"], ["dark", "Dunkel"]]);
  h += "<label>Wort-für-Wort-Übersetzung</label>" + seg("decode", [["immer", "Immer"], ["tippen", "Antippen"], ["aus", "Aus"]]) + '<p class="note">Am Anfang „Immer“. Ab Kapitel 2 lohnt sich „Antippen“.</p>';
  h += "<label>Sprechtempo</label>" + seg("rate", [[0.7, "Langsam"], [0.85, "Normal"], [1, "Schnell"]]);
  const nat = Object.keys(AUDIO).length > 0;
  if (nat) h += "<label>Natürliche Stimmen</label>" + seg("natural", [[true, "An"], [false, "Aus"]]) + '<p class="note">Vorab erzeugte Aufnahmen mit eigenen Stimmen für die Figuren. Die iPhone-Stimme springt nur ein, wo es noch keine Aufnahme gibt. Polnische Piper-Stimmen (rhasspy/piper-voices).</p>';
  h += '<label>' + (nat ? "iPhone-Stimme (Ersatz)" : "Stimme für Semyon") + '</label>';
  if (!speechOK) h += '<p class="note">Dieses Gerät kann nicht vorlesen.</p>';
  else if (!svVoices.length) h += '<p class="note">Keine polnische Stimme gefunden.</p>';
  else h += '<div style="display:flex;flex-direction:column;gap:8px">' + svVoices.map((v, i) => '<button class="btn ' + (v === svVoice ? "red" : "ghost") + ' block" style="justify-content:space-between" data-act="pickVoice" data-i="' + i + '" aria-pressed="' + (v === svVoice) + '"><span>' + esc(vLabel(v)) + "</span>" + ic("spk", 18) + "</button>").join("") + "</div>";
  if (svVoices.length > 1) h += "<label>Figuren mit eigenen Stimmen</label>" + seg("multi", [[true, "An"], [false, "Aus"]]) + '<p class="note">Ola, Oma und die anderen sprechen dann mit den übrigen polnischen Stimmen auf dem iPhone.</p>';
  else if (speechOK && svVoices.length === 1) h += '<p class="note">Für verschiedene Stimmen auf dem iPhone weitere polnische Stimmen laden und die App neu starten.</p>';
  if (speechOK && !svVoice) h += '<p class="note">iPhone: Einstellungen › Bedienungshilfen › Gesprochene Inhalte › Stimmen › Polnisch, dort eine Stimme laden.</p>';
  h += "<label>Töne</label>" + seg("sound", [[true, "An"], [false, "Aus"]]);
  h += "<label>Tagesziel Lernen</label>" + seg("goalApp", [[20, "20 Min"], [30, "30 Min"], [45, "45 Min"]]);
  h += "<label>Tagesziel Hören</label>" + seg("goalListen", [[15, "15 Min"], [20, "20 Min"], [30, "30 Min"]]);
  h += "<label>Tagesziel Sprechen</label>" + seg("goalSpeak", [[5, "5 Min"], [10, "10 Min"], [15, "15 Min"]]);
  h += '<label>Sicherung</label><p class="note" style="margin-top:0">' + (Sync.enabled ? "Dein Fortschritt wird zusätzlich im Netz gesichert." : "Dein Fortschritt liegt auf diesem iPhone. Lade ab und zu eine Sicherung herunter, zum Beispiel in die Dateien-App.") + "</p>";
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-act="downloadBackup">Sicherung herunterladen</button><button class="btn ghost" data-act="importToggle">Sicherung laden</button></div>';
  if (ui.backupText) h += '<p class="note">Kopieren ging nicht automatisch. Markiere den Text und kopiere ihn selbst:</p><textarea readonly>' + esc(ui.backupText) + "</textarea>";
  if (ui.importOpen) h += '<p class="note">Wähle eine Sicherungsdatei aus oder füge den Text ein.</p><input type="file" id="impf" accept=".json,application/json" style="margin:6px 0 10px"><textarea id="imp" placeholder="Sicherung hier einfügen"></textarea><button class="btn red" style="margin-top:8px" data-act="importDo">Übernehmen</button>';
  h += '<label>Neu anfangen</label><button class="btn ghost" data-act="reset" style="color:var(--bad)">' + (ui.resetArmed ? "Wirklich alles löschen?" : "Fortschritt zurücksetzen") + "</button>";
  return h + "</div></div>";
}

/* ---------- Render ---------- */
let lastKey = "";
function applyTheme() {
  const t = S.set.theme; if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
}
function render() {
  applyTheme();
  if (!D) return;
  const key = ui.lesson ? "lesson-" + ui.lesson.step + "-" + ui.lesson.phase + "-" + ui.lesson.sh + "-" + ui.lesson.exI : ui.tab;
  const y = key === lastKey ? window.scrollY : 0;
  let h;
  if (ui.lesson) h = viewLesson();
  else {
    const v = ui.tab === "path" ? viewPath() : ui.tab === "review" ? viewReview() : ui.tab === "listen" ? viewListen() : ui.tab === "speak" ? viewSpeak() : viewProgress();
    h = '<main class="scroll">' + v + "</main>" + tabbar();
  }
  if (ui.sheet) h += sheet();
  $("#app").innerHTML = h;
  if (key === lastKey) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastKey = key;
}

/* ---------- Actions ---------- */
const A = {
  spMode(d) { stopSpeech(); ui.speak.mode = d.v; ui.speak.shown = false; render(); },
  spQ() { const q = curQ(); if (q) say(q.q, {who: q.who}); },
  spShow() { ui.speak.shown = true; render(); const q = curQ(); if (q) say(q.a, {who: NAME}); },
  spA() { const q = curQ(); if (q) say(q.a, {who: NAME}); },
  spNext(d) { if (d.ok === "1") { sfx.ok(); addPts(3); } else sfx.tap(); ui.speak.i++; ui.speak.shown = false; render(); const q = curQ(); if (q) say(q.q, {who: q.who}); },
  spSh(d) { const ln = curShadow(); say(lineText(ln), {who: ln.who, rate: d.r === "1" ? S.set.rate : 0.6}); },
  spShNext() { stopSpeech(); ui.speak.sh++; addPts(1); render(); const ln = curShadow(); say(lineText(ln), {who: ln.who}); },
  spSnd(d) { stopSpeech(); ui.speak.snd = d.v; render(); },
  spWord(d) { say(d.w); },
  async spSndAll() {
    const g = D.sounds.find(x => x.id === ui.speak.snd) || D.sounds[0];
    stopSpeech(); const my = playTok;
    for (const w of g.words) { if (my !== playTok) return; await speak(w[0]); if (my !== playTok) return; await wait(1800); }
  },
  sayWord(d) { const w = ui.lesson.l.words[+d.i]; if (w) say(w[0]); },
  tab(d) { stopSpeech(); ui.listen.playing = false; ui.tab = d.v; if (d.v === "review") startReview(); render(); },
  chap(d) { ui.chapter = d.v; render(); },
  settings() { ui.sheet = true; ui.resetArmed = false; ui.importOpen = false; ui.backupText = ""; render(); },
  closeSheet() { ui.sheet = false; render(); },
  closeSheetBg(d, el, e) { if (e.target === el) { ui.sheet = false; render(); } },
  setv(d) {
    let v = d.v; if (v === "true") v = true; else if (v === "false") v = false; else if (!isNaN(+v)) v = +v;
    S.set[d.k] = v; save(); render();
    if (d.k === "sound" && v) sfx.ok();
  },
  pickVoice(d) { const v = svVoices[+d.i]; if (!v) return; S.set.voice = v.voiceURI; svVoice = v; save(); render(); say("Cześć, " + NAME + "! Tak brzmi mój głos."); },
  testVoice() { say("Cześć, " + NAME + "! Witaj w aplikacji Polski. Jak się dzisiaj masz?"); },
  rateSet(d) { S.set.rate = +d.v; save(); render(); },
  decode(d) { S.set.decode = d.v; save(); render(); },
  open(d) { openLesson(d.id); },
  node(d) {
    if (d.st === "done" || d.st === "cur") openLesson(d.id);
    else if (d.st === "lock") toast("Schließe zuerst die vorige Lektion ab.", "img/thinking.webp");
    else toast("Diese Lektion kommt bald.", "img/sleeping.webp");
  },
  closeLesson() { stopSpeech(); Rec.reset(); ui.lesson = null; render(); },
  playAll() { playLesson(ui.lesson.step === 2); },
  next() {
    const L = ui.lesson; stopSpeech(); L.playing = false; L.status = "";
    if (L.step < 4) { L.step++; addPts(5); } render(); window.scrollTo(0, 0);
  },
  tok(d, el) {
    const ln = ui.lesson.l.lines[+d.l], p = ln.t[+d.t];
    if (S.set.decode === "tippen" || (ui.lesson.step === 3 && S.set.decode === "aus")) el.classList.toggle("show");
    say(normWord(p[0]));
    if (needRender) { needRender = false; render(); }
  },
  sayLine(d) { const ln = ui.lesson.l.lines[+d.l]; say(lineText(ln), {who: ln.who}); if (needRender) { needRender = false; render(); } },
  revLine(d, el) { const le = $("#ln-" + d.l); if (le) le.classList.toggle("rev"); el.textContent = le && le.classList.contains("rev") ? "Übersetzung verbergen" : "Übersetzung zeigen"; },
  shPlay(d) { const L = ui.lesson, ln = L.l.lines[L.sh]; say(lineText(ln), {rate: d.r === "1" ? S.set.rate : 0.6, who: ln.who}); },
  shNext() { const L = ui.lesson; stopSpeech(); Rec.reset(); L.sh++; render(); },
  async recStart() { stopSpeech(); await Rec.start(); },
  recStop() { Rec.stop(); },
  recPlay() { stopSpeech(); Rec.play(); },
  pick(d) { const e = ui.lesson.ex[ui.lesson.exI]; if (e.res) return; const p = +d.p; if (!e.picked.includes(p)) { e.picked.push(p); sfx.tap(); } render(); },
  unpick(d) { const e = ui.lesson.ex[ui.lesson.exI]; if (e.res) return; e.picked.splice(+d.k, 1); render(); },
  check() {
    const e = ui.lesson.ex[ui.lesson.exI];
    const norm = s => s.toLowerCase().replace(/[!?.,…]/g, "").replace(/\s+/g, " ").trim();
    const got = e.picked.map(pi => e.pool[pi].w).join(" ");
    e.res = norm(got) === norm(e.sv) ? "ok" : "bad";
    if (e.res === "ok") { sfx.ok(); addPts(3); } else sfx.bad();
    render(); say(e.sv);
  },
  exNext() { const L = ui.lesson; stopSpeech(); L.exI++; if (L.exI >= L.ex.length) L.phase = "grammar"; render(); window.scrollTo(0, 0); },
  finish() { finishLesson(); },
  flip() { ui.review.flipped = true; render(); const ref = cardRef(ui.review.queue[0][0]); if (ref) say(ref.sv); },
  sayCard() { const ref = cardRef(ui.review.queue[0][0]); if (ref) say(ref.sv); },
  rate(d) {
    const R = ui.review, [id, c] = R.queue.shift(), g = +d.g, n = schedule(c, g, Date.now());
    S.cards[id] = n; S.reviews++;
    if (g === 1) { R.queue.push([id, n]); sfx.bad(); } else { R.done++; sfx.ok(); }
    R.flipped = false; addPts(g === 1 ? 0 : 2); render();
  },
  lplay(d) { playList(d.id); },
  lstop() { stopSpeech(); ui.listen.playing = false; render(); },
  copyBackup() {
    const txt = JSON.stringify(S);
    const fail = () => { ui.backupText = txt; render(); };
    try { navigator.clipboard.writeText(txt).then(() => toast("Sicherung kopiert. Leg sie z. B. in deinen Notizen ab."), fail); } catch (e) { fail(); }
  },
  downloadBackup() {
    const txt = JSON.stringify(S);
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], {type: "application/json"}));
      a.download = "polski-sicherung-" + today() + ".json"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) { A.copyBackup(); }
  },
  importToggle() { ui.importOpen = !ui.importOpen; render(); },
  importDo() {
    try { const r = JSON.parse($("#imp").value); if (!r || !r.v || !r.cards) throw 0; S = Object.assign(DEF(), r, {set: Object.assign(DEF().set, r.set || {})}); save(); pushDb(); ui.importOpen = false; toast("Sicherung übernommen."); render(); }
    catch (e) { toast("Das sieht nicht nach einer Sicherung aus."); }
  },
  reset() {
    if (!ui.resetArmed) { ui.resetArmed = true; render(); setTimeout(() => { if (ui.resetArmed) { ui.resetArmed = false; render(); } }, 4000); return; }
    const keepSet = S.set; S = DEF(); S.set = keepSet; save(); pushDb(); ui.resetArmed = false; ui.sheet = false; ui.tab = "path"; toast("Alles zurückgesetzt."); render();
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  unlockAudio();
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
addEventListener("pageshow", () => render());

/* ---------- Boot ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("change", e => {
  if (e.target && e.target.id === "impf" && e.target.files[0]) { e.target.files[0].text().then(t => { $("#imp").value = t; }); }
});
fetch("audio/index.json").then(r => r.ok ? r.json() : {}).catch(() => ({})).then(a => { AUDIO = a || {}; if (ui.sheet) render(); });
fetch("lessons.json").then(r => r.json()).then(d => { D = d; checkBadges(); render(); initStorage(); })
  .catch(() => { $("#app").innerHTML = '<p style="padding:40px;text-align:center">Die Lektionen konnten nicht geladen werden. Bitte lade die Seite neu.</p>'; });
</script>
</body>
</html>
